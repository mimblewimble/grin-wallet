[package]
name = "grin_wallet_impls"
version = "5.5.1"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Concrete types derived from libwallet traits"
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin-wallet"
keywords = [ "crypto", "grin", "mimblewimble" ]
exclude = ["**/*.grin", "**/*.grin2"]
edition = "2021"

[dependencies]
blake2-rfc = "0.2"
thiserror = "1"
futures = "0.3"
rand = "0.6"
serde = "1"
serde_derive = "1"
serde_json = "1"
log = "0.4"
ring = "0.17.14"
chrono = { version = "0.4.11", features = ["serde"] }
lazy_static = "1"
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", default-features = false, features = ["socks", "native-tls", "system-proxy", "charset", "http2"] }
async-trait = "0.1.92"

grin_wallet_util = { path = "../util", version = "5.5.1" }
grin_wallet_config = { path = "../config", version = "5.5.1" }
grin_wallet_libwallet = { path = "../libwallet", version = "5.5.1" }

##### Grin Imports

grin_core = { workspace = true }
grin_keychain = { workspace = true }
grin_chain = { workspace = true }
grin_util = { workspace = true }
grin_api = { workspace = true }
grin_p2p = { workspace = true, features = ["tor"] }

#####
