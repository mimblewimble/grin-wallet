[package]
name = "grin_wallet_controller"
version = "5.4.1"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Controllers for grin wallet instantiation"
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin-wallet"
keywords = [ "crypto", "grin", "mimblewimble" ]
exclude = ["**/*.grin", "**/*.grin2"]
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["sync"] }
hyper = { version = "1.10.1", features = ["full"] }
http-body-util = "0.1.3"
rand = "0.7"
serde = "1"
serde_json = "1"
log = "0.4"
prettytable-rs = "0.10"
term = "0.6"
uuid = { version = "1.23.4", features = ["serde", "v4"] }
easy-jsonrpc-mw = "0.5.4"
lazy_static = "1"
thiserror = "1"
qr_code = "1.1.0"

grin_wallet_util = { path = "../util", version = "5.4.1" }
grin_wallet_api = { path = "../api", version = "5.4.1" }
grin_wallet_impls = { path = "../impls", version = "5.4.1" }
grin_wallet_libwallet = { path = "../libwallet", version = "5.4.1" }
grin_wallet_config = { path = "../config", version = "5.4.1" }

##### Grin Imports

grin_core = { path = "../grin/core"}
grin_keychain = { path = "../grin/keychain"}
grin_util = { path = "../grin/util"}
grin_api = { path = "../grin/api"}
grin_chain = { path = "../grin/chain"}

#####

[dev-dependencies]
ed25519-dalek = "2"