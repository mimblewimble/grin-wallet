[package]
name = "grin_wallet"
version = "5.5.0"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Simple, private and scalable cryptocurrency implementation based on the MimbleWimble chain format."
license = "Apache-2.0"
repository = "https://github.com/mimblewimble/grin-wallet"
keywords = [ "crypto", "grin", "mimblewimble" ]
readme = "README.md"
exclude = ["**/*.grin", "**/*.grin2"]
build = "src/build/build.rs"
edition = "2021"

[[bin]]
name = "grin-wallet"
path = "src/bin/grin-wallet.rs"

[workspace]
members = ["api", "config", "controller", "impls", "libwallet", "util"]
exclude = ["integration"]

[workspace.dependencies]
grin_api = { path = "grin/api" }
grin_chain = { path = "grin/chain" }
grin_core = { path = "grin/core" }
grin_keychain = { path = "grin/keychain" }
grin_store = { path = "grin/store" }
grin_util = { path = "grin/util" }

[dependencies]
clap = { version = "2.33", features = ["yaml"] }
rpassword = "7.5.4"
thiserror = "1"
log = "0.4"
linefeed = "0.6"
semver = "1.0.28"
rustyline = "9"
lazy_static = "1"

grin_wallet_api = { path = "./api", version = "5.5.0" }
grin_wallet_impls = { path = "./impls", version = "5.5.0" }
grin_wallet_libwallet = { path = "./libwallet", version = "5.5.0" }
grin_wallet_controller = { path = "./controller", version = "5.5.0" }
grin_wallet_config = { path = "./config", version = "5.5.0" }

##### Grin Imports

grin_core = { workspace = true }
grin_keychain = { workspace = true }
grin_util = { workspace = true }
grin_api = { workspace = true }

###### 

[build-dependencies]
built = { version = "0.8.0", features = ["git2"]}

[dev-dependencies]
url = "2.1"
serde = "1"
serde_json = "1"
easy-jsonrpc-mw = "0.5.4"
